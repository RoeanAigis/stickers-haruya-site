<!doctype html>
<html>
    <head>
        <meta property="og:title" content="(春也) Haruya Sticker Archive" />
        <meta
            property="og:description"
            content="Browse and collect stickers from the artist (春也) Haruya. Maintained by Karuizawa & O-E"
        />
        <meta property="og:type" content="website" />
        <meta
            property="og:url"
            content="https://roeanaigis.github.io/stickers-haruya-site/"
        />
        <meta
            property="og:image"
            content="https://roeanaigis.github.io/stickers-haruya-site/stickers/Cosmic%20Princess%20Kaguya/04.webp"
        />
        <meta charset="utf-8" />
        <title>(春也) Haruya Sticker Gallery</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
            rel="stylesheet"
        />

        <style>
            body {
                margin: 0;
                font-family: "Inter", sans-serif;
                background: #0b0b0f;
                color: white;
            }

            footer {
                margin-top: 60px;
                padding: 20px;
                text-align: center;
                color: #777;
                font-size: 13px;
            }

            footer .credit {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }

            footer .person {
                display: flex;
                align-items: baseline;
                gap: 6px;
            }

            footer .person i {
                font-size: 14px;
                line-height: 1;
                display: inline-block;
                vertical-align: middle;
                transform: translateY(0.5px);
            }

            footer .role {
                font-weight: 700;
                color: #bbb;
                cursor: pointer;
                transition: 0.15s;
            }

            footer .rolediscord {
                font-weight: 700;
                color: #fff;
            }

            footer .role:hover {
                color: #fff;
                text-decoration: underline;
            }

            footer .handle {
                color: #888;
                cursor: pointer;
                transition: 0.15s;
            }

            footer .handle:hover {
                color: #fff;
            }

            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px 20px;
                background: #15151d;
                border-bottom: 1px solid #222;
                position: sticky;
                top: 0;
            }

            .back {
                cursor: pointer;
                color: #aaa;
                font-weight: 600;
            }

            .back:hover {
                color: white;
            }

            .title {
                font-weight: 700;
                font-size: 16px;
            }

            .section-title {
                padding: 8px 20px;
                margin: 0;
                font-size: 13px;
                letter-spacing: 0.6px;
                color: #888;
                text-transform: uppercase;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
                padding: 10px 20px 20px 20px;
            }

            img {
                width: 100%;
                border-radius: 12px;
                cursor: pointer;
                transition: 0.15s;
            }

            img:hover {
                transform: scale(1.05);
            }
        </style>
    </head>

    <body>
        <div class="topbar">
            <div class="back" onclick="history.back()">← Back</div>
            <div class="title" id="title"></div>
        </div>

        <div id="grid"></div>

        <script>
            const BASE =
                "https://raw.githubusercontent.com/RoeanAigis/stickers-haruya-site/master/";

            const params = new URLSearchParams(window.location.search);
            const folder = params.get("folder");

            function isAnimated(src) {
                const s = src.toLowerCase();
                return s.endsWith(".gif") || s.endsWith(".webp");
            }

            function createSection(title, items) {
                if (!items || items.length === 0) return;

                const header = document.createElement("div");
                header.className = "section-title";
                header.textContent = title;

                const grid = document.createElement("div");
                grid.className = "grid";

                items.forEach((src) => {
                    const img = document.createElement("img");
                    img.src = BASE + src;
                    img.loading = "lazy";

                    img.onclick = () => {
                        const a = document.createElement("a");
                        a.href = src;
                        a.download = src.split("/").pop();
                        a.click();
                    };

                    grid.appendChild(img);
                });

                document.getElementById("grid").appendChild(header);
                document.getElementById("grid").appendChild(grid);
            }

            fetch(`${BASE}stickers.json`)
                .then((res) => res.json())
                .then((data) => {
                    const pack = data.find((p) => p.folder === folder);

                    if (!pack) {
                        document.body.innerHTML = "Not found";
                        return;
                    }

                    document.getElementById("title").textContent = pack.name;

                    const staticItems = [];
                    const animatedItems = [];

                    (pack.images || []).forEach((src) => {
                        if (isAnimated(src)) animatedItems.push(src);
                        else staticItems.push(src);
                    });

                    createSection("Static", staticItems);
                    createSection("Animated", animatedItems);
                    createSection("Lost Media", pack.lostmedia);
                });

            function showToast(text) {
                const toast = document.getElementById("copyToast");
                toast.textContent = text;
                toast.style.opacity = "1";

                setTimeout(() => {
                    toast.style.opacity = "0";
                }, 1200);
            }

            document.addEventListener("click", async (e) => {
                const role = e.target.closest(".role");
                const handle = e.target.closest(".handle");

                if (role) {
                    let text = "";

                    if (role.textContent.trim() === "Karuizawa") {
                        text = "roean.";
                    } else if (role.textContent.trim() === "O-E") {
                        text = "gakoe";
                    }

                    await navigator.clipboard.writeText(text);
                    showToast(`Copied ${text} to clipboard.`);
                }

                if (handle) {
                    const text = handle.dataset.copy;
                    await navigator.clipboard.writeText(text);
                    showToast(`Copied ${text}  to clipboard.`);
                }
            });
        </script>
    </body>

    <footer>
        <div class="credit">
            <div class="person">
                <i class="rolediscord fa-brands fa-discord"></i>
                <span class="role">Karuizawa</span>
                <span>· Developer</span>
            </div>

            <div class="person">
                <i class="rolediscord fa-brands fa-discord"></i>
                <span class="role">O-E</span>
                <span>· Major Contributor</span>
            </div>

            <div id="copyToast"></div>
        </div>
    </footer>
</html>
