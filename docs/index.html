<!doctype html>
<html>
    <head>
        <meta property="og:title" content="(春也) Haruya Sticker Archive" />
        <meta
            property="og:description"
            content="Browse and collect stickers from the artist (春也) Haruya. Maintained by Karuizawa & O-E"
        />
        <meta property="og:type" content="website" />
        <meta
            property="og:url"
            content="https://roeanaigis.github.io/stickers-haruya-site/"
        />
        <meta
            property="og:image"
            content="https://raw.githubusercontent.com/RoeanAigis/stickers-haruya-site/master/stickers/Cosmic%20Princess%20Kaguya/04.webp"
        />
        <meta charset="utf-8" />
        <title>(春也) Haruya Sticker Archive</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
            rel="stylesheet"
        />

        <style>
            body {
                margin: 0;
                font-family: "Inter", sans-serif;
                background: #0b0b0f;
                color: white;
            }

            h1 {
                margin: 0;
                padding: 24px;
                font-weight: 700;
                letter-spacing: -0.3px;
            }

            footer {
                margin-top: 60px;
                padding: 20px;
                text-align: center;
                color: #777;
                font-size: 13px;
            }

            footer .credit {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }

            footer .person {
                display: flex;
                align-items: baseline;
                gap: 6px;
            }

            footer .person i {
                font-size: 14px;
                line-height: 1;
                display: inline-block;
                vertical-align: middle;
                transform: translateY(0.5px);
            }

            footer .role {
                font-weight: 700;
                color: #bbb;
                cursor: pointer;
                transition: 0.15s;
            }

            footer .rolediscord {
                font-weight: 700;
                color: #fff;
            }

            footer .role:hover {
                color: #fff;
                text-decoration: underline;
            }

            footer .handle {
                color: #888;
                cursor: pointer;
                transition: 0.15s;
            }

            footer .handle:hover {
                color: #fff;
            }

            #copyToast {
                margin-top: 6px;
                font-size: 12px;
                color: #aaa;
                opacity: 0;
                transition: 0.2s;
                pointer-events: none;
            }

            .section {
                margin-bottom: 40px;
            }

            .section-title {
                padding: 8px 20px;
                margin: 0;
                font-size: 13px;
                letter-spacing: 0.6px;
                color: #888;
                text-transform: uppercase;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
                padding: 12px 20px 0 20px;
            }

            .card {
                background: #16161d;
                border-radius: 14px;
                overflow: hidden;
                cursor: pointer;
                transition: 0.2s;
            }

            .card:hover {
                transform: scale(1.04);
            }

            img {
                width: 100%;
                height: 140px;
                object-fit: cover;
                display: block;
            }

            .title {
                padding: 10px;
                text-align: center;
                font-weight: 600;
            }
        </style>
    </head>

    <body>
        <h1>(春也) Haruya Sticker Archive</h1>

        <div id="root"></div>

        <footer>
            <div class="credit">
                <div class="person">
                    <i class="rolediscord fa-brands fa-discord"></i>
                    <span class="role">Karuizawa</span>
                    <span>· Developer</span>
                </div>

                <div class="person">
                    <i class="rolediscord fa-brands fa-discord"></i>
                    <span class="role">O-E</span>
                    <span>· Major Contributor</span>
                </div>

                <div id="copyToast"></div>
            </div>
        </footer>

        <script>
            const BASE =
                "https://raw.githubusercontent.com/RoeanAigis/stickers-haruya-site/master/";

            fetch(`${BASE}stickers.json`)
                .then((res) => res.json())
                .then((data) => {
                    const root = document.getElementById("root");

                    const known = [];
                    const unknown = [];

                    data.forEach((pack) => {
                        if (pack.folder.startsWith("_IDK")) {
                            unknown.push(pack);
                        } else {
                            known.push(pack);
                        }
                    });

                    function createSection(title, items) {
                        if (!items.length) return;

                        const section = document.createElement("div");
                        section.className = "section";

                        const header = document.createElement("div");
                        header.className = "section-title";
                        header.textContent = title;

                        const grid = document.createElement("div");
                        grid.className = "grid";

                        items.forEach((pack) => {
                            const card = document.createElement("div");
                            card.className = "card";

                            card.innerHTML = `
                                <img src="${BASE + pack.preview}">
                                <div class="title">${pack.name}</div>
                            `;

                            card.onclick = () => {
                                window.location.href = `gallery.html?folder=${encodeURIComponent(pack.folder)}`;
                            };

                            grid.appendChild(card);
                        });

                        section.appendChild(header);
                        section.appendChild(grid);
                        root.appendChild(section);
                    }

                    createSection("Stickers", known);
                    createSection("Unknown Characters", unknown);
                });

            function showToast(text) {
                const toast = document.getElementById("copyToast");
                toast.textContent = text;
                toast.style.opacity = "1";

                setTimeout(() => {
                    toast.style.opacity = "0";
                }, 1200);
            }

            document.addEventListener("click", async (e) => {
                const role = e.target.closest(".role");
                const handle = e.target.closest(".handle");

                if (role) {
                    let text = "";

                    if (role.textContent.trim() === "Karuizawa") {
                        text = "roean.";
                    } else if (role.textContent.trim() === "O-E") {
                        text = "gakoe";
                    }

                    await navigator.clipboard.writeText(text);
                    showToast(`Copied ${text} to clipboard.`);
                }

                if (handle) {
                    const text = handle.dataset.copy;
                    await navigator.clipboard.writeText(text);
                    showToast(`Copied ${text}  to clipboard.`);
                }
            });
        </script>
    </body>
</html>
